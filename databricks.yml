# This is a Databricks asset bundle definition for scd2_data_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: scd2_data_pipeline
  uuid: 94808e5b-58c0-474b-aaa3-376cdcd65a1b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fef80840-4fd8.cloud.databricks.com
    variables:
      catalog: samples
      schema: nyctaxi
      
  prod:
    mode: production
    workspace:
      host: https://dbc-fef80840-4fd8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lovecoding143@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lovecoding143@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: lovecoding143@gmail.com
        level: CAN_MANAGE
